<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title and page.title != "Home" %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-brand" href="{{ "/" | relative_url }}">
        <img src="/assets/images/full-banner.png" alt="Brand banner" width="800" />
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ "/" | relative_url }}">Home</a>
        <a href="{{ "/about/" | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <div class="footer-title">Radixhomework</div>
      <div>Personal projects, made from home.</div>
      <div class="footer-radish" aria-hidden="true">✦</div>
    </div>
  </footer>
</body>
</html>
